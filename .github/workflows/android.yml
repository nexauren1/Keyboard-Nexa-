name: Build and Release Nexa Keyboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nexa-keyboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-keyboard-debug
          path: nexa-keyboard.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nexa-keyboard.apk --clobber
          else
            gh release create "$TAG" \
              nexa-keyboard.apk \
              --title "Nexa Keyboard $TAG" \
              --generate-notes
          fi
