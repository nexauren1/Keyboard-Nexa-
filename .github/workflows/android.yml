name: Build and Release Nexa Keyboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nexa-keyboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-keyboard-debug
          path: nexa-keyboard.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ github.run_number }}"
          gh release create "$VERSION" \
            nexa-keyboard.apk \
            --title "Nexa Keyboard $VERSION" \
            --generate-notes
